name: Generate levels
on:
  push:
    branches: [main]
    paths:
      - 'tools/level-generator/make.js'
      - 'tools/level-generator/lib.js'
      - '.github/workflows/levels.yml'
  workflow_dispatch:
    inputs:
      from:
        description: First level to make
        default: '75'
      to:
        description: Last level to make
        default: '500'
jobs:
  gen:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Make this shard's levels
        working-directory: tools/level-generator
        run: node make.js ${{ inputs.from || '75' }} ${{ inputs.to || '500' }} ${{ matrix.shard }} 8
      - uses: actions/upload-artifact@v4
        with:
          name: levels-${{ matrix.shard }}
          path: tools/level-generator/out/*.json
  merge:
    needs: gen
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: levels-*
          merge-multiple: true
          path: tools/level-generator/out
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Merge into js/levels.js
        working-directory: tools/level-generator
        run: node merge.js ../../js/levels.js
      - name: Save to the repo
        run: |
          git config user.name "level-bot"
          git config user.email "level-bot@users.noreply.github.com"
          git add js/levels.js tools/level-generator/out
          git commit -m "Add generated levels" || echo "nothing to commit"
          git push
